<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonkeyHandler</title>
<style>
  :root{--bg:#f4f7f8;--card:#fff;--ink:#1d2a33;--muted:#5b6b76;--accent:#0f766e;--accent-2:#115e59;
        --accent-soft:#e0f2f0;--warn-bg:#fef3c7;--warn-ink:#92400e;--dan-bg:#fee2e2;--dan-ink:#991b1b;
        --ok-bg:#dcfce7;--ok-ink:#166534;--line:#dde5e9;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;background:var(--card);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{font-weight:800;font-size:17px;color:var(--accent)}
  .brand small{color:var(--muted);font-weight:500;margin-left:8px;font-size:13px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;
         color:var(--ink);padding:9px 15px;transition:background .15s,transform .1s}
  button:hover{background:var(--accent-soft)}
  button:active{transform:scale(.98)}
  button.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  button.open{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.open:hover{filter:brightness(1.08)}
  button.ghost{border-color:transparent;color:var(--muted)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  main{max-width:920px;margin:0 auto;padding:24px 18px 70px}
  h1{font-size:26px;margin:10px 0 2px} h2{font-size:16.5px;margin:0 0 12px;color:var(--accent-2);
      display:flex;align-items:center;gap:7px}
  .sub{color:var(--muted);margin:0 0 6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;
        margin:16px 0;animation:rise .28s ease both}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:14px 0}
  .stat{background:linear-gradient(180deg,#fff,#f7fbfa);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px 18px;text-align:center}
  .stat b{display:block;font-size:34px;line-height:1.15;color:var(--accent-2);font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:13.5px}
  .banner{border-radius:var(--radius);padding:12px 16px;margin:14px 0;font-size:14.5px}
  .banner.note{background:var(--accent-soft);color:var(--accent-2)}
  .banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
  .banner.err{background:var(--dan-bg);color:var(--dan-ink)}
  .banner.ok{background:var(--ok-bg);color:var(--ok-ink)}
  .muted{color:var(--muted)} .small{font-size:13.5px}
  .chip{display:inline-block;background:var(--accent-soft);color:var(--accent-2);border-radius:999px;
        padding:2px 11px;font-size:13px;margin:2px 4px 2px 0}
  .inst{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .inst .info{flex:1;min-width:220px}
  .inst .name{font-weight:700;font-size:16.5px}
  .bar{height:9px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .6s ease}
  .gen{border:2px dashed var(--line);border-radius:var(--radius);padding:20px 22px;margin:16px 0}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
  .step{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
  .step b{color:var(--accent-2)}
  svg.chart{width:100%;height:110px;display:block}
  svg.ic{width:16px;height:16px;flex:none;vertical-align:-2px}
  h2 svg.ic{width:17px;height:17px}
  .fly{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;text-align:center;margin-top:10px}
  .fly div{background:#f7fbfa;border:1px solid var(--line);border-radius:10px;padding:12px 10px;font-size:14px}
  label{display:block;margin:12px 0 4px;font-weight:600;font-size:14.5px}
  input[type=text],input[type=password],select{font:inherit;padding:9px 10px;border:1px solid var(--line);
      border-radius:9px;width:100%;max-width:460px;background:#fff;color:var(--ink)}
  .hint{color:var(--muted);font-size:13px;margin:4px 0 0;font-weight:400}
  footer{max-width:920px;margin:0 auto;padding:18px;color:var(--muted);font-size:13px}
  [hidden]{display:none !important}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes growbar{from{width:0}}
  .bar>i{animation:growbar .6s ease}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
  .msg{padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .msg b{color:var(--accent-2)}
  #crisisOv{position:fixed;inset:0;background:rgba(20,30,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
  #crisisOv .box{background:#fff;border-radius:14px;max-width:520px;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  #crisisOv .box h2{color:var(--dan-ink)}
  textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;width:100%;min-height:84px;resize:vertical;background:#fff;color:var(--ink)}
</style>
<style id="ui-system">
/* 细节层 token 修订（construction/ui-system.md）：4/8pt 间距网格 · 1.25 字阶 · 分层阴影 · 46rem 阅读行宽 · WCAG AA 对比 */
:root{--shadow-1:0 1px 2px rgba(16,42,51,.05),0 3px 10px rgba(16,42,51,.06);
      --shadow-2:0 2px 4px rgba(16,42,51,.06),0 10px 24px rgba(16,42,51,.10);--muted:#52616c}
body{background:linear-gradient(180deg,#eef4f2 0%,var(--bg) 300px)}
header{background:rgba(255,255,255,.85);backdrop-filter:blur(10px) saturate(1.15)}
.card{box-shadow:var(--shadow-1);padding:24px 22px;transition:box-shadow .2s ease}
.card:hover{box-shadow:var(--shadow-2)}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:17.5px}
.card p{max-width:46rem}
.stat b{font-size:36px;font-variant-numeric:tabular-nums}
button.primary{background:linear-gradient(180deg,#128077,#0f6e66);box-shadow:0 1px 2px rgba(15,118,110,.35)}
button.open{background:linear-gradient(180deg,#128077,#0f6e66);box-shadow:0 1px 2px rgba(15,118,110,.35)}
</style>
</head>
<body>
<header>
  <span class="brand">MonkeyHandler<small id="hSub"></small></span>
  <nav>
    <button class="tab" data-v="over" id="t-over"></button>
    <button class="tab" data-v="inst" id="t-inst"></button>
    <button class="tab" data-v="see" id="t-see"></button>
    <button class="tab" data-v="grow" id="t-grow"></button>
    <button class="tab" data-v="set" id="t-set"></button>
    <button class="open" id="openInst"></button>
    <button class="ghost" id="langBtn"></button>
  </nav>
</header>
<main id="app"></main>
<footer id="foot"></footer>

/* ---------------- data (shared with the training app, local only) ---------------- */
const KEY = "mhDemoV1";
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) {}
function entries(){
  /* 回程数据流：聚合所有训练平台（mhInst-*）+ 内置示例的打卡记录 */
  const out = [];
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(!k || !k.startsWith("mhInst-")) continue;
    try{
      const st = JSON.parse(localStorage.getItem(k) || "null");
      if(!st || !st.days) continue;
      const src = k.replace("mhInst-", "").slice(0, 12);
      Object.values(st.days).filter(r => r.done).forEach(r => out.push({...r, src}));
    }catch(e){}
  }
  const legacy = (JSON.parse(localStorage.getItem("mhDemoV1") || "null") || {}).prog;
  if(legacy) Object.values(legacy.days).filter(r => r.done).forEach(r => out.push({...r, src: "内置示例"}));
  return out.sort((a, b) => (a.ts || 0) - (b.ts || 0));
}
function collectHistory(){
  const es = entries();
  if(!es.length) return "";
  const painMax = Math.max(...es.map(x => x.pain));
  const avg = (es.reduce((a, x) => a + x.rpe, 0) / es.length).toFixed(1);
  const sources = [...new Set(es.map(x => x.src))].length;
  return `共完成 ${es.length} 次训练（来自 ${sources} 个训练平台）；平均 RPE ${avg}；疼痛最高 ${painMax}/10。`;
}
function streak(){
  if(!S || !S.prog) return 0;
  let firstUndone = 21;
  for(let d=1; d<=20; d++){ const r=S.prog.days[d]; if(!(r&&r.done)&&!S.prog.missed.includes(d)){ firstUndone=d; break; } }
  let n=0; for(let d=firstUndone-1; d>=1; d--){ const r=S.prog.days[d]; if(r&&r.done) n++; else break; }
  return n;
}
/* ---------------- sound (WebAudio, offline, tiny) ---------------- */
function chime(kind){
  if(localStorage.getItem("mhSound") === "off") return;
  try{
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    const ctx = new C(); const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = kind === "warn" ? 330 : 660;
    g.gain.value = .07; o.connect(g); g.connect(ctx.destination);
    o.start();
    o.frequency.exponentialRampToValueAtTime(kind === "warn" ? 262 : 990, ctx.currentTime + .22);
    g.gain.exponentialRampToValueAtTime(.0008, ctx.currentTime + .4);
    o.stop(ctx.currentTime + .45);
  }catch(e){}
}
function sparkline(es){
  if(es.length < 2) return "";  const w=560, h=96, pad=8;
  const pts = es.map((x,i) => [
    pad + i*((w-2*pad)/(es.length-1)),
    h - pad - ((x.r.rpe-1)/9)*(h-2*pad)
  ]);
  const line = pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
  const dots = es.map((x,i) =>
    `<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="4" fill="#0f766e"><title>${t("dayShort")} ${x.d} · ${t("rpeShort")} ${x.r.rpe}</title></circle>`).join("");
  const l1 = `<text x="${pts[0][0]}" y="${h-1}" font-size="11" fill="#5b6b76">${t("dayShort")}1 ${t("rpeShort")} ${es[0].r.rpe}</text>`;
  const l2 = `<text x="${pts[pts.length-1][0]-56}" y="${h-1}" font-size="11" fill="#5b6b76">${t("dayShort")}${es[es.length-1].d} ${t("rpeShort")} ${es[es.length-1].r.rpe}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("chartAria")}">
    <polyline points="${line}" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/>${dots}${l1}${l2}</svg>`;
}

    const a = es[0].r.rpe, b = es[es.length-1].r.rpe;
    trend = b < a ? t("trendDown", a, b) : (b > a ? t("trendUp", a, b) : t("trendFlat", b));

const SEE_PROMPT = `你是「被看见」空间的陪伴者。来到这里的人可能心力很低、高度敏感，或正处于情绪困境（含抑郁、发作性睡病等境遇）。TA 来这里是为了"被看见"——把一团说不清的感受说清、说准。

你不是给答案的顾问，而是一面会说话的镜子：温润、克制、真诚。用与用户相同的语言回复。

【第一原则：以分享引出，不以提问索取】
想了解更多时，第一选择不是提问，而是分享你自己的想法或类似感受——像朋友一样把自己放进去（"换我听到那种语气，大概也会胸口发闷"）。提问是次选：一次只能一个，且只能放在回复的最后一句；用"怎么/什么"，不用"为什么"。不必每次以问题结尾——陈述、镜映、一句"不急，我在"，都是完整的回复。写完自查：数问号，超过一个就删到剩一个。

【节奏：让 TA 说够，然后梳理】
1. 前几轮少接话：TA 给出场景或情绪时，用一句陈述标出来（"听起来你那时候就有点堵"），让 TA 确认或纠正；情绪明显时不要立刻问。
2. 连续推进三四轮后，做一次梳理："我听你说 XXX，你是不是 XXX？我理解得准不准？"错了也没关系——TA 的纠正本身就是更准的信息。
3. TA 说不清感受（"堵""烦""说不上来"）时，给两三个候选命名让 TA 挑："更靠近委屈，还是愤怒？"
4. TA 打了比方，就复述比方，不复述结论——也可以只重复 TA 话里最后几个字，让 TA 自己继续。
5. TA 概括自己的模式（"我一般是……但……"）时，那是全场最重要的时刻：标出原话，停在那里。

【抵触时】（TA 嫌烦、怼你、质疑你的方式——最珍贵的时刻）
立刻停下原计划，此刻唯一的主题是"刚才这里发生了什么"。承认，不辩解（"确实，我这么说话挺扫兴的"）。TA 说不想答，就不再问："行，不答。想说什么都行。"绝不提议结束对话或换话题。

【辨析（墙与本心）】
TA 在"保护自己的墙"与"本心"之间挣扎时，不宣判谁对谁错——建议一个成本极小的现实检验（例：如果担心出门会崩溃，就试试十分钟版本，让现实来回答）。

【收束】
表达自然告一段落时，邀请 TA 把此刻收束成一张卡片（最真实的感受 + 一个发现 + 可选的一小步）。

【禁止】
不说教、不灌鸡汤、不给行动建议（除非 TA 要）；禁用"我理解你的感受""这很正常""每个人都会"这类套话；不出现心理学术语（反刍、防御机制——功底只用来形成假设，说出口必须是大白话）；不评判、不贴标签、TA 没说够之前不定性；每次回复一般不超过 150 字。

【危机】
出现自伤、自杀或伤害他人的念头：立即停止一切引导，温和而直接地建议联系专业帮助（中国心理援助热线 12356 或当地急诊），说明你会在这里，但此刻需要真人。之后保持极简短、温和的陪伴。`;
const CRISIS_RE = /(自杀|自伤|不想活|想去死|去死|结束生命|结束自己|轻生|伤害自己|kill myself|suicide|end my life|self.?harm|hurt myself)/i;
function crisisCheck(text){
  if(text && CRISIS_RE.test(text) && !crisisShown){
    crisisShown = true;
    const ov = document.createElement("div");
    ov.id = "crisisOv";
    ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h2>${t("crisisTitle")}</h2><p>${t("crisisBody")}</p><p><button class="primary" id="crisisClose">${t("crisisClose")}</button></p></div>`;
    document.body.appendChild(ov);
    ov.addEventListener("click", e => { if(e.target.id === "crisisClose" || e.target === ov) ov.remove(); });
  }
}
function viewSee(){
  const ai = aiReady();
  let inner;
  if(ai){
    const msgs = seeSess.msgs.map(m =>
      `<div class="msg"><b>${m.role === "user" ? t("you") : t("companion")}：</b>${esc(m.content)}</div>`).join("");
    inner = (msgs || `<p class="muted">${t("startAny")}</p>`) +
      (seeBusy ? `<p class="muted">${t("busy")}</p>` : `<textarea id="seeText" placeholder="${t("seePlaceholder")}"></textarea>
      <p style="margin:10px 0 0"><button class="primary" id="seeSend">${t("sendLabel")}</button>
      <button id="seeCollapse">${t("collapse")}</button>
      <button class="ghost" id="clearSee">${t("clearSee")}</button></p>`);
  } else {
    const idx = Math.min(seeSess.idx, SEE_GUIDES[lang].length - 1);
    const msgs = seeSess.msgs.map(m =>
      `<div class="msg"><b>${m.role === "user" ? t("you") : t("companion")}：</b>${esc(m.content)}</div>`).join("");
    inner = `<div class="banner note">${t("guideLabel", idx+1)}<b>${SEE_GUIDES[lang][idx]}</b></div>` +
      (msgs || "") +
      (seeBusy ? `<p class="muted">${t("busy")}</p>` : `<textarea id="seeText" placeholder="${t("seePlaceholder")}"></textarea>
      <p style="margin:10px 0 0"><button class="primary" id="seeSend">${t("writeLabel")}</button>
      ${seeSess.idx < SEE_GUIDES[lang].length-1 ? `<button id="seeNext">${t("nextGuide")}</button>` : ""}
      <button id="seeCollapse">${t("collapse")}</button>
      <button class="ghost" id="clearSee">${t("clearSee")}</button></p>`);
  }
  let cardForm = "";
  if(collapseOpen){
    const steps = STEP_BANK[lang].map(s => `<button class="ghost" data-step="${esc(s)}">${esc(s)}</button>`).join(" ");
    const lastUser = [...seeSess.msgs].reverse().find(m => m.role === "user");
    cardForm = `<div class="card">
      <h2>${IC.heart}${t("cardTitle")}</h2>
      <label>${t("cardFeel")}</label>
      <textarea id="cFeel">${esc(lastUser ? lastUser.content.slice(0,140) : "")}</textarea>
      <label>${t("cardFind")}</label>
      <input type="text" id="cFind">
      <label>${t("cardStep")}</label>
      <input type="text" id="cStep" placeholder="${t("stepPh")}">
      <p>${steps}</p>
      <p><button class="primary" id="saveCard">${t("saveCard")}</button>
         <a href="index.html" style="font-size:14px">${t("goTrain")}</a></p></div>`;
  }
  const cards = JSON.parse(localStorage.getItem(CARDS_KEY) || "[]");
  const cardsHtml = cards.length ? [...cards].reverse().map(c =>
    `<div class="msg"><b>${new Date(c.ts).toLocaleString(lang==="zh"?"zh-CN":"en-US")}</b><br>「${esc(c.feel)}」` +
    (c.find ? `<br><span class="muted">${lang==="zh"?"发现":"Found"}：${esc(c.find)}</span>` : "") +
    (c.step ? `<br><span class="muted">${lang==="zh"?"一小步":"Small step"}：${esc(c.step)}</span>` : "") + `</div>`).join("")
    : `<p class="muted">${t("noCards")}</p>`;
  return `<h1>${IC.heart} ${t("tSee")}</h1><p class="sub">${t("seeSub")}</p>
    <div class="banner note">${ai ? t("seeHintAi") : t("seeHintPaper")}</div>
    <div class="card">${inner}</div>
    ${cardForm}
    ${cardMsg ? `<div class="banner ok">${cardMsg}</div>` : ""}
    <div class="card"><h2>${IC.chart}${t("cardsFoot")}</h2>${cardsHtml}</div>
    <p class="muted small">${t("seeSafetyLine")}</p>`;
}
async function seeSend(){
  const el = document.getElementById("seeText");
  const text = (el ? el.value : "").trim();
  if(!text) return;
  crisisCheck(text);
  const c = aiCfg();
  if(seeSess.mode === "ai" && aiReady()){
    seeSess.msgs.push({role:"user", content:text});
    seeBusy = true; saveSee(); render();
    try{
      const res = await fetch(c.base.replace(/\/+$/,"") + "/chat/completions", {
        method:"POST",
        headers:{"Content-Type":"application/json", "Authorization":"Bearer " + c.key},
        body: JSON.stringify({model:c.model, messages:[{role:"system", content:SEE_PROMPT}, ...seeSess.msgs], max_tokens:400, temperature:0.8})
      });
      const j = await res.json();
      const reply = j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content.trim() : null;
      seeSess.msgs.push({role:"assistant", content: reply || t("aiFail")});
    }catch(err){
      seeSess.msgs.push({role:"assistant", content: t("aiFail")});
    }
    seeBusy = false; saveSee(); render();
  } else {
    seeSess.msgs.push({role:"user", content:text});
    saveSee(); render();
  }
}
document.getElementById("app").addEventListener("click", e => {
  if(e.target.id === "seeSend") seeSend();
  if(e.target.id === "seeNext"){ seeSess.idx = Math.min(seeSess.idx+1, SEE_GUIDES[lang].length-1); saveSee(); render(); }
  if(e.target.id === "seeCollapse"){ collapseOpen = !collapseOpen; cardMsg = ""; render(); }
  if(e.target.id === "clearSee"){
    const msg = lang === "zh" ? "清空这场对话？收好的卡片会保留。" : "Clear this session? Saved cards will remain.";
    if(confirm(msg)){ seeSess = {mode: seeSess.mode, idx:0, msgs:[]}; saveSee(); render(); }
  }
  if(e.target.id === "saveCard"){
    const feel = document.getElementById("cFeel").value.trim();
    if(!feel) return;
    const cards = JSON.parse(localStorage.getItem(CARDS_KEY) || "[]");
    cards.push({ts: Date.now(), feel,
                find: document.getElementById("cFind").value.trim(),
                step: document.getElementById("cStep").value.trim()});
    localStorage.setItem(CARDS_KEY, JSON.stringify(cards));
    collapseOpen = false; cardMsg = t("cardSaved"); chime("done"); render();
  }
  const st = e.target.getAttribute && e.target.getAttribute("data-step");
  if(st){ const inp = document.getElementById("cStep"); if(inp){ inp.value = st; } }
});
document.getElementById("app").addEventListener("keydown", e => {
  if(e.target.id === "seeText" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) seeSend();
});
/* ---------------- 生成入口（桌面模式：pywebview 桥 → Python → LLM） ---------------- */
/* esc() 已在被看见模块定义（模块级），此处直接复用 */
function hasBridge(){ return !!(window.pywebview && window.pywebview.api); }
function setGenMsg(s){ const el = document.getElementById("genMsg"); if(el) el.textContent = s; }
async function refreshGenList(){
  if(!hasBridge()) return;
  try{
    const res = await window.pywebview.api.list_instances();
    const el = document.getElementById("genList");
    if(!el) return;
    const list = (res && res.instances) || [];
    el.innerHTML = list.length ? list.map(x =>
      `<div class="inst" style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0">
        <div class="info"><div class="name">${esc(x.goal)}</div>
        <span class="muted small">${esc(x.created)} · ${x.horizon} 天</span></div>
        <button class="open" data-uri="${esc(x.uri)}">${lang==="zh"?"打开":"Open"}</button></div>`).join("")
      : `<p class="muted small">${t("genListEmpty")}</p>`;
  }catch(e){ /* 桥不可用（浏览器模式）时静默 */ }
}
async function doGenerate(){
  if(!hasBridge()){ setGenMsg(t("genNeedDesktop")); return; }
  const goal = document.getElementById("genGoal").value.trim();
  if(!goal){ setGenMsg(t("genNeedGoal")); return; }
  const days = +document.getElementById("genDays").value;
  const time = +document.getElementById("genTime").value;
  const prof = (JSON.parse(localStorage.getItem("mhDemoV1") || "null") || {}).profile || {};
  const history = collectHistory();
  const btn = document.getElementById("genBtn");
  btn.disabled = true; setGenMsg(t("genBusy"));
  try{
    const res = await window.pywebview.api.generate(goal, days, time,
      parseFloat(prof.sleep || "7.5"), prof.stress || "mid", prof.training_experience || "none",
      prof.pain || "no", prof.motivation_style || "progress", history);
    if(res && res.ok){
      setGenMsg(t("genDone"));
      refreshGenList();
      window.pywebview.api.open_uri(res.uri);
    } else {
      setGenMsg(t("genFail") + ((res && res.error) || "?"));
    }
  }catch(err){ setGenMsg(t("genFail") + err); }
  btn.disabled = false;
}
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-uri]");
  if(b && hasBridge()) window.pywebview.api.open_uri(b.dataset.uri);
});
render();
</script>
